<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">study log</p>
            <h1 id="app-title">学習ログ</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="diary-form" class="diary-form">
          <label class="field-label" for="entry-date">日付</label>
          <input id="entry-date" name="date" type="date" required />

          <fieldset class="mood-field">
            <legend>今日の集中度</legend>
            <div class="mood-grid" id="mood-grid">
              <label class="mood-option">
                <input type="radio" name="mood" value="happy" required />
                <span class="mood-face">😊</span>
                <span>よく集中</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="calm" />
                <span class="mood-face">😌</span>
                <span>集中できた</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="normal" />
                <span class="mood-face">🙂</span>
                <span>ふつう</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="tired" />
                <span class="mood-face">😵‍💫</span>
                <span>少し疲れた</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="sad" />
                <span class="mood-face">🥲</span>
                <span>休憩したい</span>
              </label>
            </div>
          </fieldset>

          <label class="field-label" for="entry-note">今日の学習メモ</label>
          <textarea
            id="entry-note"
            name="note"
            rows="5"
            maxlength="160"
            placeholder="例：数学の二次関数を復習／英単語を10個覚えた／読書メモ"
            required
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">今日の学習記録を書いています</span>
            <span><span id="char-count">0</span>/160</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">recent study logs</p>
            <h2 id="history-title">最近の学習記録</h2>
          </div>
          <div class="stats-strip" aria-label="記録数">
            <strong id="entry-count">0</strong>
            <span>件</span>
          </div>
        </div>

        <section class="biorhythm" aria-labelledby="biorhythm-title">
          <div>
            <p class="biorhythm-label" id="biorhythm-title">学習ペース</p>
            <strong id="biorhythm-message">学習記録を保存すると表示されます</strong>
          </div>
          <div class="rhythm-chart" id="rhythm-chart" aria-label="最近7件の集中度の変化"></div>
          <p id="biorhythm-detail" class="biorhythm-detail">最近7件の集中度の変化を表示します。</p>
        </section>

        <div class="summary-row" id="summary-row" aria-label="集中度の集計"></div>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>検索</span>
            <input id="search-input" type="search" placeholder="学習メモから探す" />
          </label>
          <select id="mood-filter" aria-label="集中度で絞り込み">
            <option value="all">すべての集中度</option>
            <option value="happy">よく集中</option>
            <option value="calm">集中できた</option>
            <option value="normal">ふつう</option>
            <option value="tired">少し疲れた</option>
            <option value="sad">休憩したい</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>まだ学習記録がありません</strong>
          <span>今日の集中度と学習メモを記録すると、ここに表示されます。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="最近の学習記録一覧"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
